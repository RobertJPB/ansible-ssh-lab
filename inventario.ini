# Cada servidor tiene una IP fija en la red de Docker (172.30.0.11 - 172.30.0.15).
# Desde WSL con Docker Desktop esas IPs no son accesibles directamente, por eso
# Ansible se conecta a 127.0.0.1 usando el puerto SSH publicado de cada contenedor.

[servidores]
server1 ansible_host=127.0.0.1 ansible_port=2221 ip_docker=172.30.0.11
server2 ansible_host=127.0.0.1 ansible_port=2222 ip_docker=172.30.0.12
server3 ansible_host=127.0.0.1 ansible_port=2223 ip_docker=172.30.0.13
server4 ansible_host=127.0.0.1 ansible_port=2224 ip_docker=172.30.0.14
server5 ansible_host=127.0.0.1 ansible_port=2225 ip_docker=172.30.0.15

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_python_interpreter=/usr/bin/python3
